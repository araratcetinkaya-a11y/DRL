[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    airsim: needs a running AirSim simulator (skipped in CI with -m "not airsim")
xfail_strict = true
filterwarnings =
    ignore::DeprecationWarning:matplotlib.*
    ignore:sipPyTypeDict:DeprecationWarning
    ignore:.*Box bound precision lowered:UserWarning
