# Continuous Integration: runs on every push and pull request to dev and main.
# Builds the thesis environment from scratch on Linux (CPU only, no AirSim),
# lints the new code and runs the test suite with coverage.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python 3.9, CPU)
    # Python 3.9 is guaranteed on Ubuntu 22.04 runners
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      # PyQt5 is imported by the environment; no display is available on the runner
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out the code (with the Stable-Baselines3 fork submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            env/requirements-ci.txt
            requirements-dev.txt

      - name: Install pinned build tools (gym 0.19 needs older pip/setuptools)
        run: python -m pip install "pip<24.1" "setuptools==65.5.0" "wheel==0.38.4"

      - name: Install CPU-only PyTorch 1.10.1 and torchvision 0.11.2 (same versions as the thesis)
        run: python -m pip install "torch==1.10.1+cpu" "torchvision==0.11.2+cpu" -f https://download.pytorch.org/whl/cpu/torch_stable.html

      - name: Install dependencies
        run: |
          python -m pip install -r env/requirements-ci.txt -r requirements-dev.txt
          python -m pip install --no-deps -e ./stable-baselines3 -e ./gym_env

      - name: Show installed versions
        run: python -c "import sys, torch, gym, stable_baselines3 as sb3; print(sys.version); print('torch', torch.__version__, '| gym', gym.__version__, '| sb3', sb3.__version__)"

      - name: Lint new code with ruff
        run: ruff check tests gym_env/gym_env/core

      - name: Run tests with coverage
        run: python -m pytest -m "not airsim" --cov=gym_env --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
