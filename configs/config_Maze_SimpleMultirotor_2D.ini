[options]
env_name = SimpleAvoid
dynamic_name = Multirotor

navigation_3d = False
using_velocity_state = True
reward_type = reward_final

;depth, lgmd, vector
perception = depth

algo = SAC
total_timesteps = 900000

policy_name = CNN_GAP
net_arch = [64, 32, 16]
activation_function = tanh
cnn_feature_num = 128

keyboard_debug = False
generate_q_map = False
q_map_save_steps = 10000

use_wandb = True

[wandb]
name = Maze-2D-CNN_GAP-prob-solve-newyaw
notes = test

[environment]
max_depth_meters = 15
screen_height = 70
screen_width = 200

crash_distance = 2
accept_radius = 2

[multirotor]
dt = 0.01
acc_xy_max = 2.0
v_xy_max = 5
v_xy_min = 0.5
v_z_max = 2.0 
yaw_rate_max_deg = 60

; configs for DRL algorithms
[DRL]
gamma = 0.99
learning_rate = 3e-4
learning_starts = 1
buffer_size = 100000
batch_size = 512
train_freq = 1
gradient_steps = 1
action_noise_sigma = 0

[EVAL]
eval_freq = 10000
n_eval_episodes = 20
eval_log_dir = ./logs_eval
deterministic_eval = true
eval_seeds = 101,202,303,404,505,606,707,808,909,1001
